<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
        }
        
        h1, h2, .retro-text {
            font-family: 'Press Start 2P', cursive;
        }

        .btn-retro {
            background-color: #e94560;
            color: #fff;
            border-bottom: 4px solid #b52b41;
            transition: all 0.1s;
        }
        .btn-retro:active {
            transform: translateY(2px);
            border-bottom: 2px solid #b52b41;
        }
        
        .choice-btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .choice-btn:hover {
            transform: scale(1.1);
            background-color: #1e293b;
            border-color: #e94560;
        }

        /* Animations */
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: slideIn 0.4s ease-out forwards; }

        /* Full-screen centering */
        .game-wrapper {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body class="select-none">

    <!-- SETUP WARNING -->
    <div id="setup-warning" class="absolute top-0 w-full bg-red-600 text-white p-2 text-center text-xs font-bold hidden z-50">
        CONFIG ERROR: Please fill in SUPABASE_URL and SUPABASE_KEY in the script!
    </div>

    <div class="game-wrapper">
        
        <!-- MAIN MENU -->
        <div id="menu-screen" class="w-full max-w-md p-8 text-center space-y-10 animate-fade">
            <div class="space-y-4">
                <h1 class="text-3xl md:text-4xl text-yellow-400 leading-tight">ROCK PAPER<br>SCISSORS<br>BATTLE</h1>
                <p class="text-slate-400 text-[10px] tracking-[0.3em] uppercase">Online Arena</p>
            </div>
            
            <div class="space-y-4">
                <button onclick="startGameAI()" class="btn-retro w-full py-5 rounded-lg text-lg font-bold shadow-xl flex items-center justify-center gap-3">
                    <i class="fas fa-robot"></i> VS COMPUTER
                </button>
                <button onclick="showNameEntry()" class="btn-retro w-full py-5 rounded-lg text-lg font-bold shadow-xl bg-blue-600 border-blue-800 flex items-center justify-center gap-3">
                    <i class="fas fa-globe"></i> ONLINE BATTLE
                </button>
                <button onclick="showLeaderboard()" class="btn-retro w-full py-5 rounded-lg text-lg font-bold shadow-xl bg-emerald-600 border-emerald-800 flex items-center justify-center gap-3">
                    <i class="fas fa-trophy"></i> LEADERBOARD
                </button>
            </div>
        </div>

        <!-- NAME ENTRY -->
        <div id="name-screen" class="hidden w-full max-w-md p-8 text-center space-y-8 animate-fade">
            <h2 class="text-xl text-blue-400 uppercase tracking-widest">Enter Arena</h2>
            <input type="text" id="player-name-input" maxlength="12" placeholder="Your Username..." class="w-full p-4 rounded-lg bg-slate-900 text-white border-2 border-slate-700 text-center text-xl outline-none focus:border-yellow-400">
            <div class="flex gap-4">
                <button onclick="showMenu()" class="flex-1 py-4 rounded-lg bg-slate-800 hover:bg-slate-700 font-bold">BACK</button>
                <button onclick="enterLobbySystem()" class="flex-1 btn-retro py-4 rounded-lg bg-blue-600 border-blue-800 font-bold">JOIN</button>
            </div>
        </div>

        <!-- LOBBY BROWSER -->
        <div id="lobby-screen" class="hidden w-full max-w-xl p-6 flex flex-col h-[80vh] animate-fade">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xl text-yellow-400 uppercase">Live Rooms</h2>
                <button onclick="showMenu()" class="text-xs bg-slate-800 px-4 py-2 rounded-full border border-slate-600">EXIT</button>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="refreshLobbies()" class="bg-slate-800 p-4 rounded-lg hover:bg-slate-700 flex items-center justify-center gap-2"><i class="fas fa-sync"></i> REFRESH</button>
                <button onclick="createLobby()" class="btn-retro bg-emerald-600 border-emerald-800 p-4 rounded-lg flex items-center justify-center gap-2 font-bold"><i class="fas fa-plus"></i> CREATE ROOM</button>
            </div>

            <div id="lobby-list" class="flex-1 overflow-y-auto bg-slate-900/50 rounded-xl p-4 space-y-3 border border-slate-800">
                <p class="text-slate-500 text-center mt-10 italic">Looking for rivals...</p>
            </div>
        </div>

        <!-- WAITING SCREEN -->
        <div id="waiting-screen" class="hidden w-full max-w-md p-8 text-center space-y-6 animate-fade">
            <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
            <h2 class="text-xl font-bold uppercase">Waiting for Opponent</h2>
            <p id="lobby-code-display" class="text-slate-400 font-mono text-sm"></p>
            <button onclick="leaveLobby()" class="px-8 py-3 bg-red-600 rounded-lg hover:bg-red-500 font-bold">CANCEL</button>
        </div>

        <!-- COUNTDOWN -->
        <div id="countdown-screen" class="hidden absolute inset-0 bg-slate-950/95 z-50 flex flex-col items-center justify-center">
            <p class="text-slate-400 uppercase tracking-widest mb-4">Starting In</p>
            <h1 id="countdown-number" class="text-9xl text-yellow-400 font-bold animate-pulse">5</h1>
        </div>

        <!-- GAME UI -->
        <div id="game-screen" class="hidden w-full max-w-4xl p-6 flex flex-col justify-between h-[90vh] animate-fade">
            <!-- Score -->
            <div class="flex justify-between items-center pb-6 border-b border-slate-800">
                <div class="text-center w-1/3">
                    <p id="p1-name" class="text-xs text-blue-400 font-bold uppercase mb-1">YOU</p>
                    <p id="p1-score" class="text-5xl font-black">0</p>
                </div>
                <div class="text-slate-600 font-black text-2xl italic">VS</div>
                <div class="text-center w-1/3">
                    <p id="p2-name" class="text-xs text-red-400 font-bold uppercase mb-1">OPPONENT</p>
                    <p id="p2-score" class="text-5xl font-black">0</p>
                </div>
            </div>

            <!-- Arena -->
            <div class="flex-1 flex items-center justify-around relative">
                <div id="result-message" class="absolute top-0 px-6 py-2 rounded-full text-xl font-bold bg-slate-900 border border-slate-700 hidden z-10">DRAW!</div>
                
                <div id="my-move-display" class="text-8xl text-blue-500 transition-all duration-300">
                    <i class="fas fa-fist-raised"></i>
                </div>
                
                <div id="op-move-display" class="text-8xl text-red-500 transition-all duration-300">
                    <i class="fas fa-fist-raised"></i>
                </div>
            </div>

            <!-- Controls -->
            <div class="bg-slate-900/50 p-6 rounded-3xl border border-slate-800">
                <p id="instruction-text" class="text-center mb-6 text-slate-500 text-xs font-bold uppercase tracking-widest">Select Your Move</p>
                <div class="flex justify-center gap-6">
                    <button onclick="makeMove('sten')" class="choice-btn w-24 h-24 rounded-2xl bg-slate-800 border-2 border-slate-700 flex flex-col items-center justify-center gap-2 shadow-2xl">
                        <i class="fas fa-hand-rock text-3xl"></i>
                        <span class="text-[10px] font-bold uppercase">Rock</span>
                    </button>
                    <button onclick="makeMove('pase')" class="choice-btn w-24 h-24 rounded-2xl bg-slate-800 border-2 border-slate-700 flex flex-col items-center justify-center gap-2 shadow-2xl">
                        <i class="fas fa-hand-paper text-3xl"></i>
                        <span class="text-[10px] font-bold uppercase">Paper</span>
                    </button>
                    <button onclick="makeMove('sax')" class="choice-btn w-24 h-24 rounded-2xl bg-slate-800 border-2 border-slate-700 flex flex-col items-center justify-center gap-2 shadow-2xl">
                        <i class="fas fa-hand-scissors text-3xl"></i>
                        <span class="text-[10px] font-bold uppercase">Scissors</span>
                    </button>
                </div>
                <p id="status-text" class="text-center mt-6 text-yellow-500 text-sm font-bold min-h-[20px]"></p>
            </div>
        </div>

        <!-- WINNER SCREEN -->
        <div id="winner-screen" class="hidden absolute inset-0 bg-slate-950/98 z-[60] flex flex-col items-center justify-center space-y-8 animate-fade">
            <h1 id="end-title" class="text-6xl text-yellow-400 retro-text text-center px-4">VICTORY!</h1>
            <button onclick="showMenu()" class="btn-retro px-10 py-5 rounded-xl text-xl font-bold">MAIN MENU</button>
        </div>

        <!-- LEADERBOARD -->
        <div id="leaderboard-screen" class="hidden w-full max-w-xl p-8 h-[80vh] flex flex-col space-y-6 animate-fade">
            <h2 class="text-xl text-yellow-400 text-center retro-text">TOP 10 PLAYERS</h2>
            <div class="bg-slate-900/80 rounded-2xl flex-1 overflow-y-auto border border-slate-800 p-2">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-slate-500 text-[10px] font-bold uppercase">
                            <th class="px-4 py-4">Rank</th>
                            <th class="px-4 py-4">Player</th>
                            <th class="px-4 py-4 text-right">Wins</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- JS -->
                    </tbody>
                </table>
            </div>
            <button onclick="showMenu()" class="py-4 bg-slate-800 rounded-xl w-full font-bold">CLOSE</button>
        </div>

    </div>

    <script>
        // --- CONFIG --- (Dina värden här!)
        const SUPABASE_URL = 'https://bqdbgsvcrpjqxflhupsn.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_ElL56Wu9aJJppRv-ECWLbw_K_CfLWwk'; 

        let supabaseClient = null; 
        let gameMode = 'ai';
        let playerName = localStorage.getItem('rps_player_name') || '';
        let deviceId = localStorage.getItem('rps_device_id') || crypto.randomUUID();
        localStorage.setItem('rps_device_id', deviceId);

        let currentLobbyId = null;
        let myScore = 0;
        let opScore = 0;
        let channel = null; 
        let isHost = false;
        let myMove = null;
        let opMove = null;
        let isProcessing = false;

        // Init
        if (SUPABASE_URL && SUPABASE_KEY && typeof window.supabase !== 'undefined') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } else if (!SUPABASE_URL || !SUPABASE_KEY) {
            document.getElementById('setup-warning').classList.remove('hidden');
        }

        // NAV
        function hideAll() {
            ['menu-screen', 'name-screen', 'lobby-screen', 'waiting-screen', 'game-screen', 'winner-screen', 'leaderboard-screen', 'countdown-screen'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
        }

        function showMenu() {
            hideAll();
            cleanupGame();
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        function showNameEntry() {
            if (!supabaseClient) return alert("Please configure Supabase settings!");
            hideAll();
            document.getElementById('name-screen').classList.remove('hidden');
            if (playerName) document.getElementById('player-name-input').value = playerName;
        }

        function startGameAI() {
            gameMode = 'ai';
            playerName = "You";
            startMatch("COMPUTER");
        }

        // GAMEPLAY
        function startMatch(opponentName) {
            hideAll();
            myScore = 0;
            opScore = 0;
            updateScoreUI();
            resetRoundUI();
            
            document.getElementById('p1-name').innerText = playerName.toUpperCase();
            document.getElementById('p2-name').innerText = opponentName.toUpperCase();
            document.getElementById('game-screen').classList.remove('hidden');
        }

        function makeMove(move) {
            if (myMove || isProcessing) return;
            myMove = move;
            
            const display = document.getElementById('my-move-display');
            display.innerHTML = `<i class="${getIcon(move)}"></i>`;
            display.classList.add('scale-125');
            
            document.getElementById('status-text').innerText = "WAITING...";

            if (gameMode === 'ai') {
                setTimeout(aiResponse, 800);
            } else {
                sendPvPMove(move);
            }
        }

        function aiResponse() {
            const moves = ['sten', 'sax', 'pase'];
            opMove = moves[Math.floor(Math.random() * moves.length)];
            resolveRound();
        }

        function resolveRound() {
            isProcessing = true;
            const opDisplay = document.getElementById('op-move-display');
            opDisplay.innerHTML = `<i class="${getIcon(opMove)}"></i>`;
            opDisplay.classList.add('scale-125');

            let result = "";
            if (myMove === opMove) {
                result = "DRAW!";
                showRoundResult(result, "text-yellow-400");
            } else if (
                (myMove === 'sten' && opMove === 'sax') ||
                (myMove === 'sax' && opMove === 'pase') ||
                (myMove === 'pase' && opMove === 'sten')
            ) {
                result = "POINT WON!";
                myScore++;
                showRoundResult(result, "text-emerald-400");
            } else {
                result = "POINT LOST!";
                opScore++;
                showRoundResult(result, "text-red-500");
            }

            updateScoreUI();

            if (myScore >= 10 || opScore >= 10) {
                setTimeout(() => endGame(myScore >= 10), 1500);
            } else {
                setTimeout(resetRound, 1500);
            }
        }

        function showRoundResult(text, color) {
            const msg = document.getElementById('result-message');
            msg.innerText = text;
            msg.className = `absolute top-0 px-6 py-2 rounded-full text-xl font-bold bg-slate-900 border border-slate-700 ${color}`;
            msg.classList.remove('hidden');
        }

        function resetRound() {
            myMove = null;
            opMove = null;
            isProcessing = false;
            resetRoundUI();
        }

        function resetRoundUI() {
            document.getElementById('my-move-display').innerHTML = '<i class="fas fa-fist-raised"></i>';
            document.getElementById('op-move-display').innerHTML = '<i class="fas fa-fist-raised"></i>';
            document.getElementById('my-move-display').classList.remove('scale-125');
            document.getElementById('op-move-display').classList.remove('scale-125');
            document.getElementById('status-text').innerText = "SELECT YOUR MOVE";
            document.getElementById('result-message').classList.add('hidden');
        }

        function getIcon(move) {
            if (move === 'sten') return 'fas fa-hand-rock';
            if (move === 'sax') return 'fas fa-hand-scissors';
            return 'fas fa-hand-paper';
        }

        function updateScoreUI() {
            document.getElementById('p1-score').innerText = myScore;
            document.getElementById('p2-score').innerText = opScore;
        }

        async function endGame(won) {
            document.getElementById('winner-screen').classList.remove('hidden');
            document.getElementById('end-title').innerText = won ? "VICTORY!" : "DEFEAT!";
            document.getElementById('end-title').className = won ? "text-6xl text-emerald-400 retro-text" : "text-6xl text-red-600 retro-text";
            if (won && gameMode === 'pvp') await saveWinToLeaderboard();
            if (gameMode === 'pvp') cleanupGame();
        }

        // PVP
        async function enterLobbySystem() {
            const input = document.getElementById('player-name-input').value.trim();
            if (!input) return;
            playerName = input;
            localStorage.setItem('rps_player_name', playerName);
            hideAll();
            document.getElementById('lobby-screen').classList.remove('hidden');
            refreshLobbies();
        }

        async function refreshLobbies() {
            const list = document.getElementById('lobby-list');
            list.innerHTML = '<p class="text-center p-10">Scanning...</p>';
            const { data, error } = await supabaseClient.from('GameTables').select('*').eq('status', 'waiting').order('created_at', { ascending: false });
            if (error) return;
            list.innerHTML = '';
            if (data.length === 0) list.innerHTML = '<p class="text-slate-500 text-center mt-10">No rooms found.</p>';
            data.forEach(lobby => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700";
                div.innerHTML = `<span>${lobby.host_name}'s Room</span><button onclick="joinLobby('${lobby.id}', '${lobby.host_name}')" class="px-5 py-2 bg-blue-600 rounded-lg text-xs font-bold">JOIN</button>`;
                list.appendChild(div);
            });
        }

        async function createLobby() {
            const { data, error } = await supabaseClient.from('GameTables').insert([{ host_name: playerName, status: 'waiting' }]).select().single();
            if (error) return;
            currentLobbyId = data.id;
            isHost = true;
            hideAll();
            document.getElementById('waiting-screen').classList.remove('hidden');
            document.getElementById('lobby-code-display').innerText = `ID: ${currentLobbyId.substring(0,8)}`;
            subscribeToLobby(currentLobbyId);
        }

        async function joinLobby(id, host) {
            const { error } = await supabaseClient.from('GameTables').update({ player2_name: playerName, status: 'playing' }).eq('id', id);
            if (error) return;
            currentLobbyId = id;
            isHost = false;
            gameMode = 'pvp';
            subscribeToLobby(id);
            startCountdown(host); 
        }

        function subscribeToLobby(id) {
            channel = supabaseClient.channel(`game_${id}`);
            channel
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'GameTables', filter: `id=eq.${id}` }, (payload) => {
                    if (isHost && payload.new.status === 'playing') {
                        gameMode = 'pvp';
                        startCountdown(payload.new.player2_name);
                    }
                })
                .on('broadcast', { event: 'move' }, ({ payload }) => {
                    if (payload.player !== playerName) {
                        opMove = payload.move;
                        if (myMove) resolveRound();
                        else document.getElementById('status-text').innerText = "OPPONENT READY!";
                    }
                })
                .subscribe();
        }

        function startCountdown(opp) {
            hideAll();
            const screen = document.getElementById('countdown-screen');
            const num = document.getElementById('countdown-number');
            screen.classList.remove('hidden');
            let c = 5;
            num.innerText = c;
            const t = setInterval(() => {
                c--;
                num.innerText = c;
                if (c <= 0) { clearInterval(t); screen.classList.add('hidden'); startMatch(opp); }
            }, 1000);
        }

        async function sendPvPMove(m) {
            await channel.send({ type: 'broadcast', event: 'move', payload: { player: playerName, move: m } });
            if (opMove) resolveRound();
        }

        function leaveLobby() { if (currentLobbyId && isHost) supabaseClient.from('GameTables').delete().eq('id', currentLobbyId); showMenu(); }
        function cleanupGame() { if (channel) supabaseClient.removeChannel(channel); channel = null; currentLobbyId = null; }

        async function saveWinToLeaderboard() {
            const { data } = await supabaseClient.from('leaderboard').select('wins').eq('device_id', deviceId).single();
            await supabaseClient.from('leaderboard').upsert({ device_id: deviceId, name: playerName, wins: (data?.wins || 0) + 1 });
        }

        async function showLeaderboard() {
            hideAll();
            document.getElementById('leaderboard-screen').classList.remove('hidden');
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '<tr><td colspan="3" class="text-center p-10">Loading...</td></tr>';
            const { data } = await supabaseClient.from('leaderboard').select('name, wins').order('wins', { ascending: false }).limit(10);
            tbody.innerHTML = '';
            data?.forEach((r, i) => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-800";
                tr.innerHTML = `<td class="px-4 py-4 text-yellow-500 font-bold">#${i + 1}</td><td class="px-4 py-4">${r.name}</td><td class="px-4 py-4 text-right font-bold text-emerald-400">${r.wins}</td>`;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
